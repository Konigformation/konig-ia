<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Post Everyday — publiez partout, en une seule fois">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14182B"/>
      <stop offset="1" stop-color="#1C2140"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop stop-color="#4F46E5" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- anneaux concentriques -->
  <g stroke="#4F46E5" stroke-opacity="0.18" fill="none" stroke-dasharray="2 9" stroke-width="1.5">
    <circle cx="600" cy="270" r="150"/>
    <circle cx="600" cy="270" r="235"/>
    <circle cx="600" cy="270" r="330"/>
    <circle cx="600" cy="270" r="440"/>
  </g>

  <!-- pastille logo -->
  <g transform="translate(600 148)">
    <rect x="-34" y="-34" width="68" height="68" rx="18" fill="#4F46E5"/>
    <g stroke="#ffffff" stroke-width="4.6" stroke-linecap="round">
      <line x1="-16" y1="-11" x2="16" y2="-11"/>
      <line x1="-16" y1="0" x2="16" y2="0"/>
      <line x1="-16" y1="11" x2="2" y2="11"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="600" y="288" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" fill="#ffffff" letter-spacing="-1">Post Everyday</text>

  <!-- tagline -->
  <text x="600" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#A99FF5">Publiez partout, en une seule fois.</text>

  <!-- eyebrow -->
  <text x="600" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#7E86A8">VOS RÉSEAUX, UN SEUL ENDROIT</text>

  <!-- chips réseaux -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#E7E9F5" text-anchor="middle">
    <g transform="translate(340 470)">
      <rect x="0" y="0" width="150" height="52" rx="26" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="30" cy="26" r="9" fill="#0A66C2"/>
      <text x="93" y="33">LinkedIn</text>
    </g>
    <g transform="translate(505 470)">
      <rect x="0" y="0" width="158" height="52" rx="26" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="30" cy="26" r="9" fill="#1877F2"/>
      <text x="97" y="33">Facebook</text>
    </g>
    <g transform="translate(678 470)">
      <rect x="0" y="0" width="162" height="52" rx="26" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="30" cy="26" r="9" fill="#E1306C"/>
      <text x="100" y="33">Instagram</text>
    </g>
    <g transform="translate(340 536)">
      <rect x="0" y="0" width="132" height="52" rx="26" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="30" cy="26" r="9" fill="#25F4EE"/>
      <text x="84" y="33">TikTok</text>
    </g>
    <g transform="translate(487 536)">
      <rect x="0" y="0" width="150" height="52" rx="26" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="30" cy="26" r="9" fill="#FF0000"/>
      <text x="93" y="33">YouTube</text>
    </g>
    <g transform="translate(652 536)">
      <rect x="0" y="0" width="208" height="52" rx="26" fill="#4F46E5"/>
      <text x="104" y="33" fill="#ffffff">+ tout au même endroit</text>
    </g>
  </g>
</svg>
