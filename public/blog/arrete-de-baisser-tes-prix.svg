<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Arrête de baisser tes prix : une étiquette de prix bradée et barrée face à une offre à sa vraie valeur — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="330" r="380" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.14">
    <circle cx="945" cy="330" r="160"/>
    <circle cx="945" cy="330" r="230"/>
    <circle cx="945" cy="330" r="300"/>
  </g>

  <!-- tag contre-tendance -->
  <g>
    <rect x="90" y="70" width="200" height="34" rx="17" fill="url(#gacc)"/>
    <text x="190" y="93" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">CONTRE-TENDANCE</text>
  </g>

  <!-- etiquette bradee (barree) -->
  <g transform="rotate(-8 800 300)">
    <path d="M720 250 h120 l70 60 -70 60 h-120 z" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
    <circle cx="880" cy="310" r="9" fill="none" stroke="#C3C9DC" stroke-width="3"/>
    <text x="756" y="322" font-size="34" font-weight="800" fill="#B7BECF" font-family="system-ui, sans-serif">-30%</text>
    <line x1="726" y1="262" x2="908" y2="360" stroke="#E23B3B" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  </g>
  <text x="800" y="410" font-size="14" font-weight="600" fill="#8A93AC" text-anchor="middle" font-family="system-ui, sans-serif">La remise détruit ta marge</text>

  <!-- offre pleine valeur -->
  <g>
    <path d="M980 250 h110 l58 55 -58 55 h-110 z" fill="url(#gacc)"/>
    <circle cx="1092" cy="305" r="8" fill="#FFFFFF"/>
    <text x="1012" y="318" font-size="30" font-weight="800" fill="#FFFFFF" font-family="system-ui, sans-serif">100%</text>
  </g>
  <text x="1050" y="410" font-size="14" font-weight="700" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">Vends la valeur</text>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="185" font-size="30" font-weight="600" fill="#2946C8">Tout le monde te ment</text>
    <text x="90" y="252" font-size="50" font-weight="800" fill="#111A3D">Arrête de baisser</text>
    <text x="90" y="308" font-size="50" font-weight="800" fill="#111A3D">tes prix.</text>
    <text x="90" y="360" font-size="22" font-weight="500" fill="#5A6488">Une remise de 10 % peut exiger 50 %</text>
    <text x="90" y="390" font-size="22" font-weight="500" fill="#5A6488">de ventes en plus. La preuve chiffrée.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
