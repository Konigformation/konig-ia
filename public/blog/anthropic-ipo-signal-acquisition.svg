<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Anthropic entre en bourse à 47 milliards de dollars : le signal que l'IA est devenue une infrastructure incontournable — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="945" cy="315" r="150"/>
    <circle cx="945" cy="315" r="215"/>
    <circle cx="945" cy="315" r="280"/>
  </g>

  <!-- graphique bourse -->
  <g>
    <rect x="710" y="190" width="340" height="250" rx="16" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
    <rect x="710" y="190" width="340" height="40" rx="16" fill="url(#gacc)"/><rect x="710" y="214" width="340" height="16" fill="url(#gacc)"/>
    <text x="732" y="217" font-size="15" font-weight="800" fill="#FFFFFF" font-family="system-ui, sans-serif">ANT · Nasdaq</text>
    <text x="1030" y="217" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="end" font-family="system-ui, sans-serif">▲</text>
    <!-- axes -->
    <g stroke="#E5E8F0" stroke-width="1.5">
      <line x1="740" y1="270" x2="1020" y2="270"/><line x1="740" y1="320" x2="1020" y2="320"/><line x1="740" y1="370" x2="1020" y2="370"/>
    </g>
    <!-- courbe montante -->
    <path d="M745 400 L800 388 L855 360 L910 350 L965 300 L1015 258" stroke="#2946C8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1015" cy="258" r="7" fill="#2946C8"/>
    <text x="1010" y="420" font-size="24" font-weight="800" fill="#111A3D" text-anchor="end" font-family="system-ui, sans-serif">47 Md$</text>
    <text x="745" y="420" font-size="12" font-weight="600" fill="#8A93AC" font-family="system-ui, sans-serif">run-rate</text>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Actualité IA · Nov. 2026</text>
    <text x="90" y="214" font-size="48" font-weight="800" fill="#111A3D">Anthropic entre</text>
    <text x="90" y="270" font-size="48" font-weight="800" fill="#111A3D">en bourse.</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">Le signal que l'IA n'est plus une</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">option pour ton acquisition.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
