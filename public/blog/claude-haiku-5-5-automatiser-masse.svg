<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Claude Haiku 5.5 : un petit modèle rapide et bon marché qui traite des tâches d'acquisition en masse pour presque rien — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="945" cy="315" r="150"/>
    <circle cx="945" cy="315" r="215"/>
    <circle cx="945" cy="315" r="280"/>
  </g>

  <!-- file d'items entrants -->
  <g fill="#C3C9DC">
    <rect x="700" y="214" width="46" height="34" rx="6"/>
    <rect x="700" y="258" width="46" height="34" rx="6"/>
    <rect x="700" y="302" width="46" height="34" rx="6"/>
    <rect x="700" y="346" width="46" height="34" rx="6"/>
    <rect x="700" y="390" width="46" height="34" rx="6"/>
  </g>
  <text x="723" y="432" font-size="13" font-weight="600" fill="#8A93AC" text-anchor="middle" font-family="system-ui, sans-serif">×1000 leads</text>

  <!-- puce Haiku -->
  <g>
    <rect x="796" y="270" width="118" height="90" rx="16" fill="url(#gacc)"/>
    <g stroke="#FFFFFF" stroke-width="3" opacity="0.9">
      <line x1="820" y1="270" x2="820" y2="256"/><line x1="855" y1="270" x2="855" y2="256"/><line x1="890" y1="270" x2="890" y2="256"/>
      <line x1="820" y1="360" x2="820" y2="374"/><line x1="855" y1="360" x2="855" y2="374"/><line x1="890" y1="360" x2="890" y2="374"/>
      <line x1="796" y1="296" x2="782" y2="296"/><line x1="796" y1="334" x2="782" y2="334"/>
      <line x1="914" y1="296" x2="928" y2="296"/><line x1="914" y1="334" x2="928" y2="334"/>
    </g>
    <path d="M848 300 l-14 20 h12 l-6 16 l20 -24 h-12 z" fill="#FFFFFF"/>
    <text x="855" y="396" font-size="14" font-weight="800" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">Haiku 5.5</text>
  </g>

  <!-- items traités -->
  <g>
    <rect x="964" y="258" width="120" height="110" rx="12" fill="#FFFFFF" stroke="#2946C8" stroke-width="2"/>
    <g>
      <circle cx="984" cy="286" r="8" fill="url(#gacc)"/><path d="M980 286 l3 3 l6 -7" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1000" y="282" width="68" height="8" rx="4" fill="#2946C8" opacity="0.4"/>
      <circle cx="984" cy="313" r="8" fill="url(#gacc)"/><path d="M980 313 l3 3 l6 -7" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1000" y="309" width="54" height="8" rx="4" fill="#2946C8" opacity="0.4"/>
      <circle cx="984" cy="340" r="8" fill="url(#gacc)"/><path d="M980 340 l3 3 l6 -7" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1000" y="336" width="68" height="8" rx="4" fill="#2946C8" opacity="0.4"/>
    </g>
  </g>
  <text x="1024" y="392" font-size="13" font-weight="700" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">triés, pour ~0 €</text>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Actualité IA · Oct. 2026</text>
    <text x="90" y="214" font-size="46" font-weight="800" fill="#111A3D">Claude Haiku 5.5</text>
    <text x="90" y="270" font-size="30" font-weight="700" fill="#111A3D">le petit modèle qui bosse</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">Automatise les tâches de masse de</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">ton acquisition — pour presque rien.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
