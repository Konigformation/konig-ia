<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Tu n'as pas besoin d'une grosse équipe : une personne équipée d'IA égale une équipe entière — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="955" cy="330" r="380" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.14">
    <circle cx="955" cy="330" r="160"/>
    <circle cx="955" cy="330" r="230"/>
    <circle cx="955" cy="330" r="300"/>
  </g>

  <!-- tag -->
  <g>
    <rect x="90" y="70" width="200" height="34" rx="17" fill="url(#gacc)"/>
    <text x="190" y="93" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">CONTRE-TENDANCE</text>
  </g>

  <!-- grosse équipe (grise) -->
  <g fill="#C3C9DC">
    <g transform="translate(700,230)"><circle cx="0" cy="0" r="12"/><path d="M-14 26 a14 10 0 0 1 28 0" /></g>
    <g transform="translate(740,230)"><circle cx="0" cy="0" r="12"/><path d="M-14 26 a14 10 0 0 1 28 0" /></g>
    <g transform="translate(780,230)"><circle cx="0" cy="0" r="12"/><path d="M-14 26 a14 10 0 0 1 28 0" /></g>
    <g transform="translate(700,300)"><circle cx="0" cy="0" r="12"/><path d="M-14 26 a14 10 0 0 1 28 0" /></g>
    <g transform="translate(740,300)"><circle cx="0" cy="0" r="12"/><path d="M-14 26 a14 10 0 0 1 28 0" /></g>
    <g transform="translate(780,300)"><circle cx="0" cy="0" r="12"/><path d="M-14 26 a14 10 0 0 1 28 0" /></g>
  </g>
  <text x="742" y="372" font-size="14" font-weight="600" fill="#8A93AC" text-anchor="middle" font-family="system-ui, sans-serif">Équipe / agence · coût fixe</text>

  <!-- = -->
  <text x="852" y="296" font-size="40" font-weight="800" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">=</text>

  <!-- 1 personne + IA -->
  <g>
    <circle cx="965" cy="280" r="40" fill="url(#gacc)"/>
    <circle cx="965" cy="268" r="13" fill="#FFFFFF"/><path d="M943 308 a22 16 0 0 1 44 0" fill="#FFFFFF"/>
    <!-- badge IA -->
    <g transform="translate(1000,248)">
      <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="#2946C8" stroke-width="2.5"/>
      <text x="0" y="5" font-size="14" font-weight="800" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">IA</text>
    </g>
  </g>
  <text x="972" y="352" font-size="14" font-weight="700" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">1 personne + système</text>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="185" font-size="30" font-weight="600" fill="#2946C8">Tout le monde te ment</text>
    <text x="90" y="252" font-size="46" font-weight="800" fill="#111A3D">« Il faut une grosse</text>
    <text x="90" y="308" font-size="46" font-weight="800" fill="#111A3D">équipe » ? Non.</text>
    <text x="90" y="360" font-size="22" font-weight="500" fill="#5A6488">L'économie solo pèse 1,7 T$. L'IA te</text>
    <text x="90" y="390" font-size="22" font-weight="500" fill="#5A6488">donne une équipe — sans l'agence.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
