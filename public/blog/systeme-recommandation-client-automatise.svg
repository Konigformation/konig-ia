<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Le système de recommandation client automatisé : un client satisfait en amène deux, puis quatre, en chaîne — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="950" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="950" cy="315" r="150"/>
    <circle cx="950" cy="315" r="215"/>
    <circle cx="950" cy="315" r="280"/>
  </g>

  <!-- connecteurs arbre -->
  <g stroke="#2946C8" stroke-width="2.5" opacity="0.4">
    <path d="M772 315 C 820 315, 830 235, 878 235" fill="none"/>
    <path d="M772 315 C 820 315, 830 395, 878 395" fill="none"/>
    <path d="M918 235 C 955 235, 962 195, 998 195" fill="none"/>
    <path d="M918 235 C 955 235, 962 275, 998 275" fill="none"/>
    <path d="M918 395 C 955 395, 962 355, 998 355" fill="none"/>
    <path d="M918 395 C 955 395, 962 435, 998 435" fill="none"/>
  </g>

  <!-- client source -->
  <g>
    <circle cx="740" cy="315" r="40" fill="url(#gacc)"/>
    <circle cx="740" cy="303" r="13" fill="#FFFFFF"/>
    <path d="M718 342 a22 16 0 0 1 44 0" fill="#FFFFFF"/>
  </g>
  <text x="740" y="382" font-size="14" font-weight="700" fill="#1B2559" text-anchor="middle" font-family="system-ui, sans-serif">1 client ravi</text>

  <!-- niveau 2 -->
  <g fill="#2946C8">
    <g transform="translate(878,215)"><circle cx="20" cy="20" r="24" fill="#EEF1F7" stroke="#2946C8" stroke-width="2"/><circle cx="20" cy="14" r="8" fill="#2946C8"/><path d="M8 30 a12 9 0 0 1 24 0" fill="#2946C8"/></g>
    <g transform="translate(878,375)"><circle cx="20" cy="20" r="24" fill="#EEF1F7" stroke="#2946C8" stroke-width="2"/><circle cx="20" cy="14" r="8" fill="#2946C8"/><path d="M8 30 a12 9 0 0 1 24 0" fill="#2946C8"/></g>
  </g>

  <!-- niveau 3 -->
  <g>
    <g transform="translate(998,175)"><circle cx="16" cy="16" r="18" fill="#EEF1F7" stroke="#2946C8" stroke-width="2"/><circle cx="16" cy="11" r="6" fill="#2946C8" opacity="0.7"/><path d="M7 26 a9 7 0 0 1 18 0" fill="#2946C8" opacity="0.7"/></g>
    <g transform="translate(998,255)"><circle cx="16" cy="16" r="18" fill="#EEF1F7" stroke="#2946C8" stroke-width="2"/><circle cx="16" cy="11" r="6" fill="#2946C8" opacity="0.7"/><path d="M7 26 a9 7 0 0 1 18 0" fill="#2946C8" opacity="0.7"/></g>
    <g transform="translate(998,335)"><circle cx="16" cy="16" r="18" fill="#EEF1F7" stroke="#2946C8" stroke-width="2"/><circle cx="16" cy="11" r="6" fill="#2946C8" opacity="0.7"/><path d="M7 26 a9 7 0 0 1 18 0" fill="#2946C8" opacity="0.7"/></g>
    <g transform="translate(998,415)"><circle cx="16" cy="16" r="18" fill="#EEF1F7" stroke="#2946C8" stroke-width="2"/><circle cx="16" cy="11" r="6" fill="#2946C8" opacity="0.7"/><path d="M7 26 a9 7 0 0 1 18 0" fill="#2946C8" opacity="0.7"/></g>
  </g>
  <text x="1014" y="470" font-size="14" font-weight="700" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">…en chaîne</text>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Système · Recommandation</text>
    <text x="90" y="214" font-size="48" font-weight="800" fill="#111A3D">1 client ravi</text>
    <text x="90" y="270" font-size="48" font-weight="800" fill="#111A3D">= 2 nouveaux.</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">Le système qui transforme tes clients</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">en machine à recommandations.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
