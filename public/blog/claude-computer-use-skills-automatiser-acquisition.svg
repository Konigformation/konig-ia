<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Claude computer use : un agent IA qui pilote un navigateur et des fichiers pour automatiser l'acquisition — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="940" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="940" cy="315" r="150"/>
    <circle cx="940" cy="315" r="215"/>
    <circle cx="940" cy="315" r="280"/>
  </g>

  <!-- fenetre navigateur pilotee -->
  <g>
    <rect x="740" y="180" width="330" height="220" rx="16" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
    <rect x="740" y="180" width="330" height="38" rx="16" fill="#EAF0FF"/>
    <rect x="740" y="205" width="330" height="13" fill="#EAF0FF"/>
    <circle cx="762" cy="199" r="6" fill="#C3C9DC"/>
    <circle cx="782" cy="199" r="6" fill="#C3C9DC"/>
    <circle cx="802" cy="199" r="6" fill="#C3C9DC"/>
    <g fill="#D9DEEA">
      <rect x="762" y="240" width="180" height="12" rx="6"/>
      <rect x="762" y="266" width="286" height="12" rx="6"/>
      <rect x="762" y="292" width="240" height="12" rx="6"/>
      <rect x="762" y="318" width="286" height="12" rx="6"/>
    </g>
    <!-- curseur agent -->
    <path d="M980 330 l0 46 l12 -12 l8 16 l8 -4 l-8 -16 l16 0 z" fill="url(#gacc)" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- fichier -->
  <g>
    <rect x="756" y="420" width="70" height="86" rx="10" fill="#FFFFFF" stroke="#2946C8" stroke-width="2.5"/>
    <path d="M808 420 v18 h18" fill="none" stroke="#2946C8" stroke-width="2.5"/>
    <g stroke="#2946C8" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <line x1="770" y1="452" x2="812" y2="452"/>
      <line x1="770" y1="468" x2="812" y2="468"/>
      <line x1="770" y1="484" x2="798" y2="484"/>
    </g>
    <text x="860" y="470" font-size="16" font-weight="700" fill="#1B2559" font-family="system-ui, sans-serif">Files API</text>
    <text x="860" y="494" font-size="14" font-weight="500" fill="#5A6488" font-family="system-ui, sans-serif">+ Skills API</text>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Actualité IA · Agents</text>
    <text x="90" y="214" font-size="48" font-weight="800" fill="#111A3D">Claude pilote ton</text>
    <text x="90" y="270" font-size="48" font-weight="800" fill="#111A3D">navigateur.</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">« Computer use » en accès général —</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">comment automatiser ton acquisition.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
