<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Écrire une page de vente avec l'IA : une page structurée accroche, preuve, offre et appel à l'action qui convertit — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="945" cy="315" r="150"/>
    <circle cx="945" cy="315" r="215"/>
    <circle cx="945" cy="315" r="280"/>
  </g>

  <!-- page de vente -->
  <g>
    <rect x="800" y="165" width="210" height="300" rx="16" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
    <!-- accroche -->
    <rect x="822" y="190" width="166" height="16" rx="6" fill="#111A3D"/>
    <rect x="822" y="214" width="120" height="10" rx="5" fill="#8A93AC"/>
    <!-- bloc image / preuve -->
    <rect x="822" y="238" width="166" height="48" rx="8" fill="#EAF0FF"/>
    <text x="905" y="267" font-size="12" font-weight="700" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">★★★★★ Preuve</text>
    <!-- texte -->
    <g fill="#D9DEEA"><rect x="822" y="300" width="166" height="8" rx="4"/><rect x="822" y="316" width="140" height="8" rx="4"/><rect x="822" y="332" width="166" height="8" rx="4"/></g>
    <!-- CTA -->
    <rect x="822" y="362" width="166" height="42" rx="10" fill="url(#gacc)"/>
    <text x="905" y="388" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, sans-serif">Réserver →</text>
    <!-- garantie -->
    <rect x="822" y="418" width="166" height="26" rx="8" fill="#F4F6FF" stroke="#2946C8" stroke-width="1.5"/>
    <text x="905" y="435" font-size="11" font-weight="600" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">Garantie · risque levé</text>
  </g>

  <!-- etiquettes structure -->
  <g font-family="system-ui, sans-serif">
    <text x="748" y="203" font-size="12" font-weight="700" fill="#2946C8" text-anchor="end">Accroche</text>
    <text x="1062" y="267" font-size="12" font-weight="700" fill="#2946C8">Preuve</text>
    <text x="1062" y="388" font-size="12" font-weight="700" fill="#2946C8">Offre + CTA</text>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Hack · Conversion</text>
    <text x="90" y="214" font-size="46" font-weight="800" fill="#111A3D">Ta page de vente,</text>
    <text x="90" y="270" font-size="46" font-weight="800" fill="#111A3D">écrite par l'IA.</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">La structure + les prompts pour une</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">page qui convertit, en une après-midi.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
