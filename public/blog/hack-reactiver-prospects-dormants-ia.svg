<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Réactiver ses prospects dormants avec l'IA : des contacts endormis se réveillent et deviennent des rendez-vous — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="945" cy="315" r="150"/>
    <circle cx="945" cy="315" r="215"/>
    <circle cx="945" cy="315" r="280"/>
  </g>

  <!-- contacts dormants (gris, zZ) -->
  <g>
    <circle cx="735" cy="230" r="30" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
    <circle cx="735" cy="222" r="10" fill="#B7BECF"/>
    <path d="M718 248 a17 13 0 0 1 34 0" fill="#B7BECF"/>
    <text x="770" y="212" font-size="18" font-weight="700" fill="#B7BECF" font-family="system-ui, sans-serif">z</text>
    <text x="784" y="200" font-size="14" font-weight="700" fill="#C3C9DC" font-family="system-ui, sans-serif">z</text>

    <circle cx="735" cy="315" r="30" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
    <circle cx="735" cy="307" r="10" fill="#B7BECF"/>
    <path d="M718 333 a17 13 0 0 1 34 0" fill="#B7BECF"/>
    <text x="770" y="297" font-size="18" font-weight="700" fill="#B7BECF" font-family="system-ui, sans-serif">z</text>

    <circle cx="735" cy="400" r="30" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
    <circle cx="735" cy="392" r="10" fill="#B7BECF"/>
    <path d="M718 418 a17 13 0 0 1 34 0" fill="#B7BECF"/>
    <text x="770" y="382" font-size="18" font-weight="700" fill="#B7BECF" font-family="system-ui, sans-serif">z</text>
  </g>

  <!-- fleche IA -->
  <path d="M812 315 h96" stroke="#2946C8" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10"/>
  <path d="M908 315 l-18 -11 M908 315 l-18 11" stroke="#2946C8" stroke-width="4" stroke-linecap="round"/>
  <text x="858" y="300" font-size="15" font-weight="700" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">IA</text>

  <!-- contact reveille = rendez-vous -->
  <g>
    <circle cx="1000" cy="315" r="66" fill="url(#gacc)"/>
    <circle cx="1000" cy="300" r="20" fill="#FFFFFF"/>
    <path d="M968 352 a32 24 0 0 1 64 0" fill="#FFFFFF"/>
    <circle cx="1050" cy="268" r="18" fill="#FFFFFF" stroke="#2946C8" stroke-width="3"/>
    <path d="M1042 268 l6 6 l12 -13" stroke="#2946C8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1000" y="415" font-size="16" font-weight="700" fill="#1B2559" text-anchor="middle" font-family="system-ui, sans-serif">Rendez-vous</text>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Hack · Relance</text>
    <text x="90" y="214" font-size="50" font-weight="800" fill="#111A3D">Réveille ta base</text>
    <text x="90" y="270" font-size="50" font-weight="800" fill="#111A3D">dormante.</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">Signe sans prospecter à froid —</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">15-30 % de conversion, avec l'IA.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
