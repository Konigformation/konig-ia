<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Analyser ses appels de vente avec l'IA : un appel transcrit devient un script de closing et une banque d'objections — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="945" cy="315" r="150"/>
    <circle cx="945" cy="315" r="215"/>
    <circle cx="945" cy="315" r="280"/>
  </g>

  <!-- appel + waveform -->
  <g>
    <circle cx="760" cy="315" r="46" fill="url(#gacc)"/>
    <path d="M746 300 a10 10 0 0 1 10 -10 l4 0 a6 6 0 0 1 6 6 l0 6 a5 5 0 0 1 -5 5 l-4 0 a2 2 0 0 0 -2 2 c0 10 8 18 18 18 a2 2 0 0 0 2 -2 l0 -4 a5 5 0 0 1 5 -5 l6 0 a6 6 0 0 1 6 6 l0 4 a10 10 0 0 1 -10 10 c-24 0 -44 -20 -44 -44 z" fill="#FFFFFF"/>
  </g>
  <g stroke="#2946C8" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="824" y1="305" x2="824" y2="325"/>
    <line x1="838" y1="295" x2="838" y2="335"/>
    <line x1="852" y1="285" x2="852" y2="345"/>
    <line x1="866" y1="300" x2="866" y2="330"/>
    <line x1="880" y1="290" x2="880" y2="340"/>
  </g>

  <!-- fleche -->
  <path d="M905 315 h30" stroke="#2946C8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M935 315 l-14 -9 M935 315 l-14 9" stroke="#2946C8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- livrables : script + banque objections -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <g transform="translate(950,225)">
      <rect width="150" height="80" rx="12" fill="#FFFFFF" stroke="#2946C8" stroke-width="2"/>
      <g fill="#2946C8" opacity="0.55"><rect x="16" y="20" width="118" height="8" rx="4"/><rect x="16" y="38" width="98" height="8" rx="4"/><rect x="16" y="56" width="118" height="8" rx="4"/></g>
      <text x="16" y="-8" font-size="14" font-weight="700" fill="#1B2559">Script qui close</text>
    </g>
    <g transform="translate(950,340)">
      <rect width="150" height="80" rx="12" fill="url(#gacc)"/>
      <path d="M22 30 l7 7 l13 -14" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 55 l7 7 l13 -14" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="54" y="37" font-size="13" font-weight="700" fill="#FFFFFF">Objection 1</text>
      <text x="54" y="62" font-size="13" font-weight="700" fill="#FFFFFF">Objection 2</text>
      <text x="16" y="-8" font-size="14" font-weight="700" fill="#1B2559">Banque d'objections</text>
    </g>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Hack · Closing</text>
    <text x="90" y="214" font-size="48" font-weight="800" fill="#111A3D">Tes appels de</text>
    <text x="90" y="270" font-size="48" font-weight="800" fill="#111A3D">vente, décodés.</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">L'IA transforme tes « non » en</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">script qui close. Dès aujourd'hui.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
