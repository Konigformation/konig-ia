<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="GPT-6 et le deep research : une loupe analyse un dossier prospect rempli de données en quelques minutes — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="945" cy="315" r="150"/>
    <circle cx="945" cy="315" r="215"/>
    <circle cx="945" cy="315" r="280"/>
  </g>

  <!-- dossier -->
  <g>
    <rect x="740" y="170" width="250" height="290" rx="14" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
    <rect x="740" y="170" width="250" height="52" rx="14" fill="url(#gacc)"/>
    <rect x="740" y="196" width="250" height="26" fill="url(#gacc)"/>
    <text x="764" y="204" font-size="18" font-weight="800" fill="#FFFFFF" font-family="system-ui, sans-serif">Dossier prospect</text>
    <g fill="#D9DEEA">
      <rect x="764" y="246" width="140" height="10" rx="5"/>
      <rect x="764" y="272" width="200" height="10" rx="5"/>
      <rect x="764" y="298" width="170" height="10" rx="5"/>
    </g>
    <!-- data points cochés -->
    <g>
      <circle cx="772" cy="336" r="8" fill="url(#gacc)"/><path d="M768 336 l3 3 l6 -6" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="788" y="331" width="150" height="9" rx="4.5" fill="#2946C8" opacity="0.4"/>
      <circle cx="772" cy="362" r="8" fill="url(#gacc)"/><path d="M768 362 l3 3 l6 -6" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="788" y="357" width="120" height="9" rx="4.5" fill="#2946C8" opacity="0.4"/>
      <circle cx="772" cy="388" r="8" fill="url(#gacc)"/><path d="M768 388 l3 3 l6 -6" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="788" y="383" width="160" height="9" rx="4.5" fill="#2946C8" opacity="0.4"/>
    </g>
    <text x="764" y="432" font-size="14" font-weight="700" fill="#2946C8" font-family="system-ui, sans-serif">Prêt en 5 min</text>
  </g>

  <!-- loupe -->
  <g>
    <circle cx="1010" cy="360" r="52" fill="#FFFFFF" fill-opacity="0.5" stroke="#2946C8" stroke-width="8"/>
    <line x1="1046" y1="396" x2="1086" y2="436" stroke="#2946C8" stroke-width="12" stroke-linecap="round"/>
    <text x="1010" y="368" font-size="22" font-weight="800" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">GPT-6</text>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Actualité IA · Sept. 2026</text>
    <text x="90" y="214" font-size="48" font-weight="800" fill="#111A3D">GPT-6 est là.</text>
    <text x="90" y="278" font-size="30" font-weight="700" fill="#111A3D">Le prompt « deep research »</text>
    <text x="90" y="330" font-size="22" font-weight="500" fill="#5A6488">qui te fait un dossier prospect</text>
    <text x="90" y="360" font-size="22" font-weight="500" fill="#5A6488">complet en 5 minutes.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
