<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="La guerre des prix de l'IA : les tarifs des modèles chutent, automatiser son acquisition coûte deux fois moins cher — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="945" cy="315" r="150"/>
    <circle cx="945" cy="315" r="215"/>
    <circle cx="945" cy="315" r="280"/>
  </g>

  <!-- axes + courbe de prix qui chute -->
  <g stroke="#C3C9DC" stroke-width="2">
    <line x1="720" y1="200" x2="720" y2="430"/>
    <line x1="720" y1="430" x2="1050" y2="430"/>
  </g>
  <path d="M735 232 C 810 250, 850 360, 920 385 S 1010 415, 1040 418" stroke="#2946C8" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- points modeles -->
  <circle cx="760" cy="245" r="9" fill="url(#gacc)"/>
  <circle cx="920" cy="385" r="9" fill="url(#gacc)"/>
  <circle cx="1040" cy="418" r="9" fill="url(#gacc)"/>
  <text x="760" y="228" font-size="13" font-weight="700" fill="#1B2559" text-anchor="middle" font-family="system-ui, sans-serif">Opus 5</text>
  <text x="936" y="372" font-size="13" font-weight="700" fill="#1B2559" font-family="system-ui, sans-serif">Opus 5.5</text>
  <text x="1040" y="404" font-size="13" font-weight="700" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">GPT-6</text>

  <!-- badge -40% -->
  <g>
    <circle cx="1000" cy="255" r="52" fill="url(#gacc)"/>
    <text x="1000" y="250" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, sans-serif">−40%</text>
    <text x="1000" y="274" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, sans-serif">de coût</text>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Actualité IA · Sept. 2026</text>
    <text x="90" y="214" font-size="48" font-weight="800" fill="#111A3D">La guerre des</text>
    <text x="90" y="270" font-size="48" font-weight="800" fill="#111A3D">prix de l'IA.</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">Automatiser ton acquisition coûte</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">2× moins cher qu'il y a un mois.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
