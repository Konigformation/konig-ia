<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Tu n'as pas besoin d'un budget pub : la publicité payante coûte beaucoup plus cher qu'un système d'acquisition organique — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="950" cy="330" r="380" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.14">
    <circle cx="950" cy="330" r="160"/>
    <circle cx="950" cy="330" r="230"/>
    <circle cx="950" cy="330" r="300"/>
  </g>

  <!-- tag -->
  <g>
    <rect x="90" y="70" width="200" height="34" rx="17" fill="url(#gacc)"/>
    <text x="190" y="93" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">CONTRE-TENDANCE</text>
  </g>

  <!-- colonne pub (chère, barrée) -->
  <g>
    <rect x="720" y="230" width="110" height="190" rx="10" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
    <rect x="736" y="252" width="78" height="150" rx="6" fill="#C3C9DC"/>
    <text x="775" y="220" font-size="14" font-weight="700" fill="#8A93AC" text-anchor="middle" font-family="system-ui, sans-serif">Pub payante</text>
    <text x="775" y="337" font-size="22" font-weight="800" fill="#6B7490" text-anchor="middle" font-family="system-ui, sans-serif">937 €</text>
    <text x="775" y="358" font-size="12" font-weight="600" fill="#8A93AC" text-anchor="middle" font-family="system-ui, sans-serif">/ client</text>
    <line x1="714" y1="224" x2="836" y2="426" stroke="#E23B3B" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- colonne système organique (accent) -->
  <g>
    <rect x="900" y="330" width="110" height="90" rx="10" fill="url(#gacc)"/>
    <rect x="916" y="352" width="78" height="52" rx="6" fill="#FFFFFF" opacity="0.25"/>
    <text x="955" y="320" font-size="14" font-weight="700" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">Système organique</text>
    <text x="955" y="388" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, sans-serif">171 €</text>
    <text x="955" y="408" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, sans-serif">/ client</text>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="185" font-size="30" font-weight="600" fill="#2946C8">Tout le monde te ment</text>
    <text x="90" y="252" font-size="48" font-weight="800" fill="#111A3D">« Il faut un budget</text>
    <text x="90" y="308" font-size="48" font-weight="800" fill="#111A3D">pub » ? Non.</text>
    <text x="90" y="360" font-size="22" font-weight="500" fill="#5A6488">Le payant coûte 2 à 3× plus cher.</text>
    <text x="90" y="390" font-size="22" font-weight="500" fill="#5A6488">Un système, tu le possèdes. La preuve.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
