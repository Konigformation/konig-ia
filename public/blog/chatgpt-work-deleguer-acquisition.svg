<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="ChatGPT Work : un agent IA qui exécute une tâche d'acquisition complète en plusieurs étapes, en autonomie — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="945" cy="315" r="150"/>
    <circle cx="945" cy="315" r="215"/>
    <circle cx="945" cy="315" r="280"/>
  </g>

  <!-- liste de taches en cours -->
  <g>
    <rect x="730" y="178" width="300" height="274" rx="16" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
    <rect x="730" y="178" width="300" height="46" rx="16" fill="url(#gacc)"/><rect x="730" y="202" width="300" height="22" fill="url(#gacc)"/>
    <circle cx="756" cy="201" r="11" fill="#FFFFFF"/><circle cx="752" cy="201" r="3" fill="#2946C8"/><circle cx="760" cy="201" r="3" fill="#2946C8"/>
    <text x="778" y="206" font-size="16" font-weight="800" fill="#FFFFFF" font-family="system-ui, sans-serif">Agent au travail…</text>

    <!-- taches -->
    <g font-family="system-ui, sans-serif">
      <circle cx="760" cy="260" r="11" fill="url(#gacc)"/><path d="M755 260 l4 4 l7 -8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="782" y="265" font-size="15" font-weight="600" fill="#5A6488">Recherche 20 prospects</text>
      <circle cx="760" cy="300" r="11" fill="url(#gacc)"/><path d="M755 300 l4 4 l7 -8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="782" y="305" font-size="15" font-weight="600" fill="#5A6488">Qualifie + score</text>
      <!-- en cours -->
      <circle cx="760" cy="340" r="11" fill="none" stroke="#2946C8" stroke-width="3" stroke-dasharray="4 4"/>
      <text x="782" y="345" font-size="15" font-weight="700" fill="#2946C8">Rédige 20 brouillons…</text>
      <circle cx="760" cy="380" r="11" fill="#EEF1F7" stroke="#C3C9DC" stroke-width="2"/>
      <text x="782" y="385" font-size="15" font-weight="600" fill="#B7BECF">Planifie les relances</text>
    </g>
    <rect x="752" y="412" width="256" height="10" rx="5" fill="#EEF1F7"/>
    <rect x="752" y="412" width="150" height="10" rx="5" fill="url(#gacc)"/>
  </g>

  <!-- horloge heures -->
  <g>
    <circle cx="1050" cy="235" r="34" fill="#FFFFFF" stroke="#2946C8" stroke-width="2.5"/>
    <path d="M1050 235 v-18 M1050 235 l13 9" stroke="#2946C8" stroke-width="3.5" stroke-linecap="round"/>
    <text x="1050" y="292" font-size="13" font-weight="700" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">des heures</text>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Actualité IA · Agents</text>
    <text x="90" y="214" font-size="46" font-weight="800" fill="#111A3D">L'IA ne répond</text>
    <text x="90" y="270" font-size="46" font-weight="800" fill="#111A3D">plus : elle bosse.</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">ChatGPT Work exécute une tâche</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">d'acquisition complète, en autonomie.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
