<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Le système de preuve sociale automatisé : collecter des avis et témoignages en continu et les diffuser dans tout le tunnel — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="945" cy="315" r="150"/>
    <circle cx="945" cy="315" r="215"/>
    <circle cx="945" cy="315" r="280"/>
  </g>

  <!-- collecte : avis étoilés -->
  <g font-family="system-ui, sans-serif">
    <g transform="translate(700,230)">
      <rect width="130" height="40" rx="10" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
      <text x="12" y="26" font-size="15" fill="#E7B14C">★★★★★</text>
    </g>
    <g transform="translate(700,286)">
      <rect width="130" height="40" rx="10" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
      <text x="12" y="26" font-size="15" fill="#E7B14C">★★★★★</text>
    </g>
    <g transform="translate(700,342)">
      <rect width="130" height="40" rx="10" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
      <text x="12" y="26" font-size="15" fill="#E7B14C">★★★★★</text>
    </g>
    <text x="765" y="404" font-size="13" font-weight="600" fill="#5A6488" text-anchor="middle">Collecte auto</text>
  </g>

  <!-- moteur -->
  <g>
    <circle cx="905" cy="300" r="40" fill="url(#gacc)"/>
    <g stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round">
      <circle cx="905" cy="300" r="16"/>
      <path d="M905 276 v-10 M905 334 v-10 M881 300 h-10 M929 300 h-10"/>
    </g>
  </g>
  <g stroke="#2946C8" stroke-width="2.5" opacity="0.4" stroke-dasharray="6 7">
    <line x1="834" y1="300" x2="862" y2="300"/>
    <line x1="948" y1="300" x2="976" y2="300"/>
  </g>

  <!-- diffusion : page / email / post -->
  <g font-family="system-ui, sans-serif">
    <g transform="translate(980,232)"><rect width="110" height="40" rx="10" fill="#FFFFFF" stroke="#2946C8" stroke-width="2"/><text x="55" y="25" font-size="13" font-weight="700" fill="#1B2559" text-anchor="middle">Page de vente</text></g>
    <g transform="translate(980,286)"><rect width="110" height="40" rx="10" fill="#FFFFFF" stroke="#2946C8" stroke-width="2"/><text x="55" y="25" font-size="13" font-weight="700" fill="#1B2559" text-anchor="middle">Prospection</text></g>
    <g transform="translate(980,340)"><rect width="110" height="40" rx="10" fill="#FFFFFF" stroke="#2946C8" stroke-width="2"/><text x="55" y="25" font-size="13" font-weight="700" fill="#1B2559" text-anchor="middle">Posts / pub</text></g>
    <text x="1035" y="404" font-size="13" font-weight="700" fill="#2946C8" text-anchor="middle">Diffusion partout</text>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Système · Preuve sociale</text>
    <text x="90" y="214" font-size="46" font-weight="800" fill="#111A3D">La preuve qui</text>
    <text x="90" y="270" font-size="46" font-weight="800" fill="#111A3D">vend à ta place.</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">92 % des acheteurs B2B lisent un avis.</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">Le système qui la collecte et la diffuse.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
