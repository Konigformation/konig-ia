<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Un assistant IA qui répond aux prospects et prend des rendez-vous 24 heures sur 24 — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="945" cy="315" r="150"/>
    <circle cx="945" cy="315" r="215"/>
    <circle cx="945" cy="315" r="280"/>
  </g>

  <!-- assistant bulle -->
  <g>
    <circle cx="775" cy="250" r="40" fill="url(#gacc)"/>
    <rect x="759" y="236" width="32" height="24" rx="6" fill="#FFFFFF"/>
    <circle cx="768" cy="248" r="3" fill="#2946C8"/><circle cx="782" cy="248" r="3" fill="#2946C8"/>
    <line x1="775" y1="236" x2="775" y2="228" stroke="#FFFFFF" stroke-width="3"/><circle cx="775" cy="225" r="4" fill="#FFFFFF"/>
    <text x="828" y="245" font-size="16" font-weight="700" fill="#1B2559" font-family="system-ui, sans-serif">Assistant IA</text>
    <text x="828" y="266" font-size="13" font-weight="600" fill="#5A6488" font-family="system-ui, sans-serif">en ligne</text>
    <circle cx="815" cy="261" r="5" fill="#57B36B"/>
  </g>

  <!-- conversation -->
  <g>
    <rect x="755" y="308" width="150" height="36" rx="12" fill="#EEF1F7"/>
    <g fill="#B7BECF"><rect x="768" y="320" width="104" height="6" rx="3"/><rect x="768" y="331" width="72" height="6" rx="3"/></g>
    <rect x="830" y="356" width="160" height="36" rx="12" fill="#D8E0FB"/>
    <g fill="#2946C8" opacity="0.6"><rect x="843" y="368" width="120" height="6" rx="3"/><rect x="843" y="379" width="90" height="6" rx="3"/></g>
  </g>

  <!-- RDV pris -->
  <g>
    <rect x="900" y="404" width="120" height="70" rx="12" fill="#FFFFFF" stroke="#2946C8" stroke-width="2"/>
    <rect x="900" y="404" width="120" height="22" rx="12" fill="url(#gacc)"/><rect x="900" y="415" width="120" height="11" fill="url(#gacc)"/>
    <path d="M928 448 l8 8 l16 -18" stroke="#2946C8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="978" y="452" font-size="13" font-weight="700" fill="#1B2559" text-anchor="middle" font-family="system-ui, sans-serif">RDV pris</text>
  </g>

  <!-- badge 24/7 -->
  <g>
    <circle cx="1030" cy="250" r="44" fill="url(#gacc)"/>
    <text x="1030" y="258" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, sans-serif">24/7</text>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Hack · Conversion</text>
    <text x="90" y="214" font-size="46" font-weight="800" fill="#111A3D">Un assistant IA</text>
    <text x="90" y="270" font-size="46" font-weight="800" fill="#111A3D">qui répond 24/7.</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">Il répond à tes prospects et prend</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">des RDV pendant que tu dors.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
