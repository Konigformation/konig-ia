<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Le système de partenariats : deux entreprises complémentaires unissent leurs audiences pour générer des clients communs — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="945" cy="315" r="150"/>
    <circle cx="945" cy="315" r="215"/>
    <circle cx="945" cy="315" r="280"/>
  </g>

  <!-- deux audiences -->
  <g fill="#2946C8" opacity="0.65">
    <circle cx="730" cy="250" r="12"/><circle cx="730" cy="290" r="12"/><circle cx="730" cy="330" r="12"/>
    <circle cx="1070" cy="250" r="12"/><circle cx="1070" cy="290" r="12"/><circle cx="1070" cy="330" r="12"/>
  </g>
  <text x="730" y="372" font-size="13" font-weight="600" fill="#5A6488" text-anchor="middle" font-family="system-ui, sans-serif">Ton audience</text>
  <text x="1070" y="372" font-size="13" font-weight="600" fill="#5A6488" text-anchor="middle" font-family="system-ui, sans-serif">Son audience</text>

  <!-- poignee de main / partenariat -->
  <g>
    <circle cx="900" cy="290" r="64" fill="url(#gacc)"/>
    <path d="M875 290 l12 -12 a6 6 0 0 1 9 0 l8 8 l8 -8 a6 6 0 0 1 9 0 l4 4" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M884 298 l10 10 M906 298 l10 10" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- connecteurs -->
  <g stroke="#2946C8" stroke-width="2.5" opacity="0.4" stroke-dasharray="6 7">
    <line x1="744" y1="290" x2="838" y2="290"/>
    <line x1="964" y1="290" x2="1056" y2="290"/>
  </g>

  <!-- clients communs -->
  <g>
    <circle cx="900" cy="404" r="26" fill="url(#gacc)"/>
    <path d="M884 404 l10 10 l20 -22" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="900" y="458" font-size="14" font-weight="700" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">= clients partagés</text>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Système · Partenariats</text>
    <text x="90" y="214" font-size="46" font-weight="800" fill="#111A3D">Des clients via</text>
    <text x="90" y="270" font-size="46" font-weight="800" fill="#111A3D">l'audience des autres.</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">Le système de partenariats pour</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">acquérir sans repartir de zéro.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
