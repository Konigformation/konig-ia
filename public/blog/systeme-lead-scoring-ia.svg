<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Le système de lead scoring : des prospects notés et triés en chaud, tiède, froid pour ne parler qu'aux bons — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="950" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="950" cy="315" r="150"/>
    <circle cx="950" cy="315" r="215"/>
    <circle cx="950" cy="315" r="280"/>
  </g>

  <!-- entree : prospects notes -->
  <g font-family="system-ui, sans-serif">
    <rect x="700" y="250" width="110" height="130" rx="12" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
    <text x="755" y="240" font-size="14" font-weight="700" fill="#5A6488" text-anchor="middle">Leads</text>
    <g>
      <rect x="716" y="266" width="78" height="26" rx="6" fill="#EEF1F7"/><text x="724" y="284" font-size="13" font-weight="700" fill="#2946C8">5/5</text>
      <rect x="716" y="298" width="78" height="26" rx="6" fill="#EEF1F7"/><text x="724" y="316" font-size="13" font-weight="700" fill="#5A6488">3/5</text>
      <rect x="716" y="330" width="78" height="26" rx="6" fill="#EEF1F7"/><text x="724" y="348" font-size="13" font-weight="700" fill="#8A93AC">1/5</text>
    </g>
  </g>

  <!-- fleche tri -->
  <path d="M818 315 h44" stroke="#2946C8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M862 315 l-14 -9 M862 315 l-14 9" stroke="#2946C8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- sorties : chaud / tiede / froid -->
  <g font-family="system-ui, sans-serif">
    <g transform="translate(882,232)">
      <rect width="170" height="48" rx="10" fill="url(#gacc)"/>
      <path d="M22 24 l7 7 l13 -14" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="29" font-size="15" font-weight="700" fill="#FFFFFF">Chaud → appel</text>
    </g>
    <g transform="translate(882,292)">
      <rect width="170" height="48" rx="10" fill="#FFFFFF" stroke="#2946C8" stroke-width="2"/>
      <text x="22" y="29" font-size="15" font-weight="700" fill="#2946C8">Tiède → nurturing</text>
    </g>
    <g transform="translate(882,352)">
      <rect width="170" height="48" rx="10" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
      <text x="22" y="29" font-size="15" font-weight="600" fill="#8A93AC">Froid → écarté</text>
    </g>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Système · Qualification</text>
    <text x="90" y="214" font-size="46" font-weight="800" fill="#111A3D">Ne parle qu'aux</text>
    <text x="90" y="270" font-size="46" font-weight="800" fill="#111A3D">prospects prêts.</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">Le lead scoring IA note et trie tes</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">leads — tu arrêtes de perdre du temps.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
