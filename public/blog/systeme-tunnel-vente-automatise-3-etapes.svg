<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Le système en 3 étapes pour un tunnel de vente automatisé : des leads entrent, les fuites sont colmatées, des clients ressortent — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="945" cy="315" r="150"/>
    <circle cx="945" cy="315" r="215"/>
    <circle cx="945" cy="315" r="280"/>
  </g>

  <!-- leads qui entrent -->
  <g fill="#2946C8" opacity="0.7">
    <circle cx="720" cy="150" r="9"/>
    <circle cx="760" cy="150" r="9"/>
    <circle cx="800" cy="150" r="9"/>
    <circle cx="840" cy="150" r="9"/>
    <circle cx="880" cy="150" r="9"/>
  </g>

  <!-- entonnoir / tunnel -->
  <path d="M700 185 L1010 185 L930 300 L930 380 L840 430 L840 300 Z" fill="#FFFFFF" stroke="#2946C8" stroke-width="2.5" stroke-opacity="0.5"/>

  <!-- etapes -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <circle cx="855" cy="215" r="19" fill="url(#gacc)"/>
    <text x="855" y="222" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="880" cy="290" r="19" fill="url(#gacc)"/>
    <text x="880" y="297" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <circle cx="880" cy="365" r="19" fill="url(#gacc)"/>
    <text x="880" y="372" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  </g>

  <!-- fuites colmatees (gouttes barrees) -->
  <g>
    <path d="M735 250 q-8 12 0 18 q8 -6 0 -18" fill="#C3C9DC"/>
    <path d="M726 250 l18 18 M744 250 l-18 18" stroke="#2946C8" stroke-width="3" stroke-linecap="round"/>
    <text x="700" y="286" font-size="13" font-weight="600" fill="#8A93AC" text-anchor="middle" font-family="system-ui, sans-serif">fuite</text>
  </g>

  <!-- client qui ressort -->
  <g>
    <circle cx="905" cy="470" r="40" fill="url(#gacc)"/>
    <path d="M888 470 l11 12 l24 -26" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="905" y="540" font-size="16" font-weight="700" fill="#1B2559" text-anchor="middle" font-family="system-ui, sans-serif">Client signé</text>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Système · Conversion</text>
    <text x="90" y="214" font-size="50" font-weight="800" fill="#111A3D">Ton tunnel</text>
    <text x="90" y="270" font-size="50" font-weight="800" fill="#111A3D">de vente, automatisé.</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">3 étapes pour arrêter le tunnel</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">qui fuit (79 % des leads perdus).</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
