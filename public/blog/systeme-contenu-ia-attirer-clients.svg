<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Le système de contenu IA qui attire des clients : une idée source se décline en plusieurs formats de contenu distribués — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="945" cy="315" r="150"/>
    <circle cx="945" cy="315" r="215"/>
    <circle cx="945" cy="315" r="280"/>
  </g>

  <!-- source centrale -->
  <g>
    <circle cx="770" cy="315" r="52" fill="url(#gacc)"/>
    <path d="M748 300 h44 M748 315 h44 M748 330 h30" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <text x="770" y="400" font-size="16" font-weight="700" fill="#1B2559" text-anchor="middle" font-family="system-ui, sans-serif">1 idée / expertise</text>
  </g>

  <!-- branches vers formats -->
  <g stroke="#2946C8" stroke-width="2.5" opacity="0.45">
    <path d="M822 290 C 880 250, 900 220, 950 210" fill="none"/>
    <path d="M822 305 C 880 290, 910 280, 960 280" fill="none"/>
    <path d="M822 325 C 880 340, 910 350, 960 355" fill="none"/>
    <path d="M818 345 C 875 390, 905 410, 950 425" fill="none"/>
  </g>

  <!-- formats de contenu -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <g transform="translate(950,188)">
      <rect width="120" height="46" rx="10" fill="#FFFFFF" stroke="#2946C8" stroke-width="2"/>
      <text x="60" y="29" font-size="15" font-weight="600" fill="#1B2559" text-anchor="middle">Post LinkedIn</text>
    </g>
    <g transform="translate(962,258)">
      <rect width="120" height="46" rx="10" fill="#FFFFFF" stroke="#2946C8" stroke-width="2"/>
      <text x="60" y="29" font-size="15" font-weight="600" fill="#1B2559" text-anchor="middle">Newsletter</text>
    </g>
    <g transform="translate(962,334)">
      <rect width="120" height="46" rx="10" fill="#FFFFFF" stroke="#2946C8" stroke-width="2"/>
      <text x="60" y="29" font-size="15" font-weight="600" fill="#1B2559" text-anchor="middle">Vidéo courte</text>
    </g>
    <g transform="translate(950,404)">
      <rect width="120" height="46" rx="10" fill="#FFFFFF" stroke="#2946C8" stroke-width="2"/>
      <text x="60" y="29" font-size="15" font-weight="600" fill="#1B2559" text-anchor="middle">Article SEO</text>
    </g>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Système · Contenu</text>
    <text x="90" y="214" font-size="50" font-weight="800" fill="#111A3D">Le contenu qui</text>
    <text x="90" y="270" font-size="50" font-weight="800" fill="#111A3D">attire, en pilote auto.</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">3 étapes pour transformer 1 idée</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">en un mois de contenu qui vend.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
