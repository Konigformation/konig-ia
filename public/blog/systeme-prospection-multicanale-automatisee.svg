<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Le système en 3 étapes pour automatiser la prospection multicanale : LinkedIn et email convergent vers un agenda de rendez-vous — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="950" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="950" cy="315" r="150"/>
    <circle cx="950" cy="315" r="215"/>
    <circle cx="950" cy="315" r="280"/>
  </g>

  <!-- canaux -->
  <path d="M735 210 C 840 210, 860 300, 946 300" stroke="#2946C8" stroke-opacity="0.4" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="9 11"/>
  <path d="M735 425 C 840 425, 860 330, 946 330" stroke="#2946C8" stroke-opacity="0.4" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="9 11"/>

  <!-- canal LinkedIn -->
  <g>
    <rect x="655" y="178" width="80" height="64" rx="14" fill="url(#gacc)"/>
    <text x="695" y="220" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">in</text>
    <text x="695" y="262" font-size="15" font-weight="600" fill="#1B2559" text-anchor="middle"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">LinkedIn</text>
  </g>

  <!-- canal Email -->
  <g>
    <rect x="655" y="393" width="80" height="64" rx="14" fill="#FFFFFF" stroke="#2946C8" stroke-width="2.5"/>
    <path d="M667 407 h56 v36 h-56 z M667 407 l28 22 l28 -22" stroke="#2946C8" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <text x="695" y="477" font-size="15" font-weight="600" fill="#1B2559" text-anchor="middle"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Email</text>
  </g>

  <!-- agenda -->
  <g>
    <rect x="880" y="252" width="140" height="126" rx="16" fill="#FFFFFF" stroke="#2946C8" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="880" y="252" width="140" height="30" rx="16" fill="url(#gacc)"/>
    <rect x="880" y="268" width="140" height="14" fill="url(#gacc)"/>
    <g fill="#2946C8" opacity="0.85">
      <rect x="900" y="300" width="24" height="20" rx="4"/>
      <rect x="938" y="300" width="24" height="20" rx="4" opacity="0.4"/>
      <rect x="976" y="300" width="24" height="20" rx="4"/>
      <rect x="900" y="332" width="24" height="20" rx="4" opacity="0.4"/>
      <rect x="938" y="332" width="24" height="20" rx="4"/>
      <rect x="976" y="332" width="24" height="20" rx="4" opacity="0.4"/>
    </g>
    <text x="950" y="405" font-size="16" font-weight="700" fill="#1B2559" text-anchor="middle"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Rendez-vous</text>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Système · Méthode</text>
    <text x="90" y="214" font-size="50" font-weight="800" fill="#111A3D">Prospection</text>
    <text x="90" y="270" font-size="50" font-weight="800" fill="#111A3D">multicanale</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">3 étapes pour l'automatiser</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">de A à Z. +40 % d'engagement.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
