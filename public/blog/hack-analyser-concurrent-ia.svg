<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Analyser son concurrent avec l'IA : une loupe révèle le positionnement, les offres et les failles d'un concurrent — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="945" cy="315" r="150"/>
    <circle cx="945" cy="315" r="215"/>
    <circle cx="945" cy="315" r="280"/>
  </g>

  <!-- fiche concurrent -->
  <g>
    <rect x="740" y="190" width="300" height="250" rx="16" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
    <rect x="740" y="190" width="300" height="46" rx="16" fill="#EEF1F7"/><rect x="740" y="214" width="300" height="22" fill="#EEF1F7"/>
    <circle cx="766" cy="213" r="9" fill="#C3C9DC"/>
    <text x="786" y="219" font-size="15" font-weight="700" fill="#8A93AC" font-family="system-ui, sans-serif">Concurrent</text>
    <g fill="#D9DEEA">
      <rect x="766" y="262" width="150" height="10" rx="5"/>
      <rect x="766" y="286" width="210" height="10" rx="5"/>
      <rect x="766" y="310" width="180" height="10" rx="5"/>
    </g>
    <!-- failles révélées -->
    <g>
      <rect x="766" y="346" width="248" height="30" rx="8" fill="#EAF0FF" stroke="#2946C8" stroke-width="1.5"/>
      <text x="778" y="366" font-size="13" font-weight="700" fill="#2946C8" font-family="system-ui, sans-serif">Faille : pas de garantie</text>
      <rect x="766" y="384" width="248" height="30" rx="8" fill="#EAF0FF" stroke="#2946C8" stroke-width="1.5"/>
      <text x="778" y="404" font-size="13" font-weight="700" fill="#2946C8" font-family="system-ui, sans-serif">Angle libre : « sans agence »</text>
    </g>
  </g>

  <!-- loupe -->
  <g>
    <circle cx="1018" cy="258" r="50" fill="#FFFFFF" fill-opacity="0.45" stroke="#2946C8" stroke-width="8"/>
    <line x1="1053" y1="293" x2="1090" y2="330" stroke="#2946C8" stroke-width="12" stroke-linecap="round"/>
    <path d="M1000 258 l12 12 l24 -26" stroke="#2946C8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Hack · Positionnement</text>
    <text x="90" y="214" font-size="46" font-weight="800" fill="#111A3D">Espionne tes</text>
    <text x="90" y="270" font-size="46" font-weight="800" fill="#111A3D">concurrents (légalement).</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">L'IA décortique leur offre et leurs</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">failles — tu te démarques en 20 min.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
