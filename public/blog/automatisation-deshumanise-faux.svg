<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="L'automatisation déshumanise ? Faux : une bonne automatisation répond en 1 seconde et rend l'expérience plus humaine — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="950" cy="330" r="380" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.14">
    <circle cx="950" cy="330" r="160"/>
    <circle cx="950" cy="330" r="230"/>
    <circle cx="950" cy="330" r="300"/>
  </g>

  <!-- tag -->
  <g>
    <rect x="90" y="70" width="200" height="34" rx="17" fill="url(#gacc)"/>
    <text x="190" y="93" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">CONTRE-TENDANCE</text>
  </g>

  <!-- main humaine + puce IA = poignee -->
  <g>
    <!-- robot/puce -->
    <rect x="720" y="270" width="86" height="86" rx="16" fill="url(#gacc)"/>
    <circle cx="748" cy="304" r="9" fill="#FFFFFF"/><circle cx="778" cy="304" r="9" fill="#FFFFFF"/>
    <rect x="742" y="326" width="42" height="8" rx="4" fill="#FFFFFF"/>
    <line x1="763" y1="270" x2="763" y2="256" stroke="#2946C8" stroke-width="4"/><circle cx="763" cy="252" r="5" fill="#2946C8"/>
    <!-- coeur = humain -->
    <path d="M980 300 c 0 -22 34 -30 46 -8 c 12 -22 46 -14 46 8 c 0 26 -46 52 -46 52 c 0 0 -46 -26 -46 -52 z" fill="#2946C8"/>
    <!-- lien -->
    <path d="M812 313 h150" stroke="#2946C8" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
    <text x="890" y="392" font-size="15" font-weight="700" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">IA + humain = relation à l'échelle</text>
  </g>

  <!-- badge 1,1s -->
  <g>
    <circle cx="900" cy="230" r="40" fill="#FFFFFF" stroke="#2946C8" stroke-width="2"/>
    <text x="900" y="226" font-size="18" font-weight="800" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">1,1 s</text>
    <text x="900" y="245" font-size="11" font-weight="600" fill="#5A6488" text-anchor="middle" font-family="system-ui, sans-serif">de réponse</text>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="185" font-size="30" font-weight="600" fill="#2946C8">Tout le monde te ment</text>
    <text x="90" y="252" font-size="48" font-weight="800" fill="#111A3D">« L'automatisation</text>
    <text x="90" y="308" font-size="48" font-weight="800" fill="#111A3D">déshumanise » ? Faux.</text>
    <text x="90" y="360" font-size="22" font-weight="500" fill="#5A6488">Ce que les gens rejettent, c'est la</text>
    <text x="90" y="390" font-size="22" font-weight="500" fill="#5A6488">MAUVAISE automatisation. La preuve.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
