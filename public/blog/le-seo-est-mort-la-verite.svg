<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Le SEO est mort ? La vérité : les recherches finissent sans clic, il faut devenir la réponse citée par l'IA — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="950" cy="330" r="380" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.14">
    <circle cx="950" cy="330" r="160"/>
    <circle cx="950" cy="330" r="230"/>
    <circle cx="950" cy="330" r="300"/>
  </g>

  <!-- tag -->
  <g>
    <rect x="90" y="70" width="200" height="34" rx="17" fill="url(#gacc)"/>
    <text x="190" y="93" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">CONTRE-TENDANCE</text>
  </g>

  <!-- resultat classique barre (0 clic) -->
  <g>
    <rect x="700" y="205" width="180" height="90" rx="12" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
    <g fill="#CBD1DF"><rect x="716" y="224" width="120" height="9" rx="4.5"/><rect x="716" y="242" width="150" height="7" rx="3.5"/><rect x="716" y="256" width="150" height="7" rx="3.5"/><rect x="716" y="270" width="100" height="7" rx="3.5"/></g>
    <line x1="708" y1="212" x2="874" y2="288" stroke="#E23B3B" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <text x="790" y="320" font-size="14" font-weight="600" fill="#8A93AC" text-anchor="middle" font-family="system-ui, sans-serif">68 % de recherches sans clic</text>
  </g>

  <!-- reponse IA qui te cite -->
  <g>
    <rect x="905" y="230" width="200" height="130" rx="14" fill="url(#gacc)"/>
    <circle cx="931" cy="258" r="11" fill="#FFFFFF"/><path d="M925 258 l4 4 l8 -8" stroke="#2946C8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="950" y="263" font-size="14" font-weight="700" fill="#FFFFFF" font-family="system-ui, sans-serif">Réponse IA</text>
    <g fill="#FFFFFF" opacity="0.92"><rect x="925" y="284" width="156" height="8" rx="4"/><rect x="925" y="300" width="130" height="8" rx="4"/></g>
    <rect x="925" y="322" width="90" height="22" rx="11" fill="#FFFFFF"/>
    <text x="970" y="337" font-size="12" font-weight="700" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">Source : toi</text>
  </g>
  <text x="1005" y="384" font-size="14" font-weight="700" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">Deviens la réponse</text>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="185" font-size="30" font-weight="600" fill="#2946C8">Tout le monde te ment</text>
    <text x="90" y="252" font-size="52" font-weight="800" fill="#111A3D">« Le SEO est</text>
    <text x="90" y="308" font-size="52" font-weight="800" fill="#111A3D">mort » ? La vérité.</text>
    <text x="90" y="360" font-size="22" font-weight="500" fill="#5A6488">Les clics s'effondrent — mais être</text>
    <text x="90" y="390" font-size="22" font-weight="500" fill="#5A6488">trouvé n'a jamais compté autant.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
