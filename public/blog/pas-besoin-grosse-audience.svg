<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Tu n'as pas besoin d'une grosse audience : une audience massive mais passive face à une petite audience engagée qui achète — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="330" r="380" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.14">
    <circle cx="945" cy="330" r="160"/>
    <circle cx="945" cy="330" r="230"/>
    <circle cx="945" cy="330" r="300"/>
  </g>

  <!-- tag -->
  <g>
    <rect x="90" y="70" width="200" height="34" rx="17" fill="url(#gacc)"/>
    <text x="190" y="93" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">CONTRE-TENDANCE</text>
  </g>

  <!-- grosse audience passive (gris) -->
  <g>
    <g fill="#C3C9DC">
      <circle cx="700" cy="215" r="9"/><circle cx="726" cy="215" r="9"/><circle cx="752" cy="215" r="9"/><circle cx="778" cy="215" r="9"/><circle cx="804" cy="215" r="9"/><circle cx="830" cy="215" r="9"/>
      <circle cx="700" cy="241" r="9"/><circle cx="726" cy="241" r="9"/><circle cx="752" cy="241" r="9"/><circle cx="778" cy="241" r="9"/><circle cx="804" cy="241" r="9"/><circle cx="830" cy="241" r="9"/>
      <circle cx="700" cy="267" r="9"/><circle cx="726" cy="267" r="9"/><circle cx="752" cy="267" r="9"/><circle cx="778" cy="267" r="9"/><circle cx="804" cy="267" r="9"/><circle cx="830" cy="267" r="9"/>
      <circle cx="700" cy="293" r="9"/><circle cx="726" cy="293" r="9"/><circle cx="752" cy="293" r="9"/><circle cx="778" cy="293" r="9"/><circle cx="804" cy="293" r="9"/><circle cx="830" cy="293" r="9"/>
    </g>
    <text x="765" y="325" font-size="14" font-weight="600" fill="#8A93AC" text-anchor="middle" font-family="system-ui, sans-serif">50 000 abonnés · 0,8 % engagés</text>
  </g>

  <!-- petite audience engagee (accent, achete) -->
  <g>
    <g fill="#2946C8">
      <circle cx="930" cy="385" r="14"/><circle cx="972" cy="385" r="14"/><circle cx="1014" cy="385" r="14"/>
      <circle cx="951" cy="420" r="14"/><circle cx="993" cy="420" r="14"/>
    </g>
    <!-- petits paniers / check -->
    <g stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M924 385 l4 4 l7 -8"/><path d="M966 385 l4 4 l7 -8"/><path d="M1008 385 l4 4 l7 -8"/>
      <path d="M945 420 l4 4 l7 -8"/><path d="M987 420 l4 4 l7 -8"/>
    </g>
    <text x="972" y="462" font-size="14" font-weight="700" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">3 000 abonnés · qui achètent</text>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="185" font-size="30" font-weight="600" fill="#2946C8">Tout le monde te ment</text>
    <text x="90" y="252" font-size="46" font-weight="800" fill="#111A3D">Pas besoin d'une</text>
    <text x="90" y="308" font-size="46" font-weight="800" fill="#111A3D">grosse audience.</text>
    <text x="90" y="360" font-size="22" font-weight="500" fill="#5A6488">Une petite audience engagée + un</text>
    <text x="90" y="390" font-size="22" font-weight="500" fill="#5A6488">système battent 50 000 abonnés passifs.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
