<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Définir son client idéal avec l'IA : une cible avec au centre la fiche du client parfait — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="945" cy="315" r="150"/>
    <circle cx="945" cy="315" r="215"/>
    <circle cx="945" cy="315" r="280"/>
  </g>

  <!-- cible -->
  <g>
    <circle cx="945" cy="315" r="138" fill="none" stroke="#2946C8" stroke-opacity="0.25" stroke-width="10"/>
    <circle cx="945" cy="315" r="100" fill="none" stroke="#2946C8" stroke-opacity="0.35" stroke-width="10"/>
    <circle cx="945" cy="315" r="62" fill="none" stroke="#2946C8" stroke-opacity="0.5" stroke-width="10"/>
  </g>

  <!-- fiche client au centre -->
  <g>
    <rect x="895" y="268" width="100" height="94" rx="12" fill="#FFFFFF" stroke="#2946C8" stroke-width="2.5"/>
    <circle cx="945" cy="294" r="15" fill="url(#gacc)"/>
    <path d="M927 322 a18 13 0 0 1 36 0" fill="url(#gacc)"/>
    <g fill="#2946C8" opacity="0.4"><rect x="909" y="336" width="72" height="6" rx="3"/><rect x="909" y="348" width="52" height="6" rx="3"/></g>
  </g>

  <!-- fleche -->
  <path d="M1108 205 l-38 38" stroke="#2946C8" stroke-width="4" stroke-linecap="round"/>
  <path d="M1070 243 l4 -20 M1070 243 l20 -4" stroke="#2946C8" stroke-width="4" stroke-linecap="round"/>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Hack · Ciblage</text>
    <text x="90" y="214" font-size="46" font-weight="800" fill="#111A3D">Ton client idéal,</text>
    <text x="90" y="270" font-size="46" font-weight="800" fill="#111A3D">en 30 minutes.</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">Avec l'IA — arrête de parler à tout</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">le monde, vise ceux qui achètent.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
