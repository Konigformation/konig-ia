<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Claude Duet, l'agent IA proactif qui anticipe et propose des actions avant qu'on les demande — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.16">
    <circle cx="945" cy="315" r="150"/>
    <circle cx="945" cy="315" r="215"/>
    <circle cx="945" cy="315" r="280"/>
  </g>

  <!-- agent -->
  <g>
    <rect x="770" y="250" width="120" height="100" rx="20" fill="url(#gacc)"/>
    <circle cx="800" cy="292" r="12" fill="#FFFFFF"/><circle cx="860" cy="292" r="12" fill="#FFFFFF"/>
    <rect x="808" y="320" width="44" height="9" rx="4.5" fill="#FFFFFF"/>
    <line x1="830" y1="250" x2="830" y2="234" stroke="#2946C8" stroke-width="4"/><circle cx="830" cy="229" r="6" fill="#2946C8"/>
    <!-- etincelle proactive -->
    <path d="M905 240 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6 z" fill="#2946C8" opacity="0.6"/>
  </g>

  <!-- bulles de suggestions proactives -->
  <g font-family="system-ui, sans-serif">
    <g transform="translate(905,290)">
      <rect width="196" height="40" rx="12" fill="#FFFFFF" stroke="#2946C8" stroke-width="2"/>
      <circle cx="22" cy="20" r="8" fill="url(#gacc)"/><path d="M18 20 l3 3 l6 -7" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="25" font-size="13" font-weight="600" fill="#1B2559">Relancer 3 prospects chauds</text>
    </g>
    <g transform="translate(905,340)">
      <rect width="196" height="40" rx="12" fill="#F4F6FF" stroke="#2946C8" stroke-width="1.5"/>
      <circle cx="22" cy="20" r="8" fill="none" stroke="#2946C8" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="40" y="25" font-size="13" font-weight="600" fill="#5A6488">Préparer le RDV de 14 h ?</text>
    </g>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Actualité IA · Agents</text>
    <text x="90" y="214" font-size="48" font-weight="800" fill="#111A3D">Claude Duet :</text>
    <text x="90" y="270" font-size="30" font-weight="700" fill="#111A3D">l'agent IA qui anticipe.</text>
    <text x="90" y="322" font-size="22" font-weight="500" fill="#5A6488">Il propose des actions avant que</text>
    <text x="90" y="352" font-size="22" font-weight="500" fill="#5A6488">tu demandes. Ce que ça change pour toi.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
