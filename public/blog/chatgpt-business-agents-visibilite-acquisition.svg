<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Les agents business dans ChatGPT : tes futurs clients parleront à ton entreprise directement dans l'IA — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="950" cy="315" r="360" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.15">
    <circle cx="950" cy="315" r="150"/>
    <circle cx="950" cy="315" r="220"/>
    <circle cx="950" cy="315" r="290"/>
  </g>

  <!-- fenêtre de chat -->
  <g>
    <rect x="800" y="180" width="300" height="270" rx="20" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
    <!-- bulle utilisateur -->
    <rect x="900" y="208" width="170" height="34" rx="12" fill="#EEF1FB"/>
    <text x="985" y="230" font-size="13" fill="#5A6488" text-anchor="middle" font-family="system-ui, sans-serif">« Qui peut m'aider ? »</text>
    <!-- bulle entreprise vérifiée -->
    <rect x="828" y="262" width="210" height="58" rx="12" fill="url(#gacc)"/>
    <text x="846" y="286" font-size="13" font-weight="700" fill="#FFFFFF" font-family="system-ui, sans-serif">Ton entreprise</text>
    <!-- badge vérifié -->
    <circle cx="1012" cy="281" r="11" fill="#FFFFFF"/>
    <path d="M1006 281 l4 4 l8 -8" stroke="#2946C8" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="846" y="306" font-size="12" fill="#D7DEF7" font-family="system-ui, sans-serif">« Voici ce qu'on propose… »</text>
    <!-- champ de saisie -->
    <rect x="828" y="400" width="244" height="30" rx="15" fill="#F4F5F9" stroke="#C3C9DC" stroke-width="1.5"/>
    <circle cx="1057" cy="415" r="10" fill="#2946C8"/>
    <path d="M1053 415 h8 M1058 412 l3 3 l-3 3" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2946C8">Actualité IA · ChatGPT</text>
    <text x="90" y="214" font-size="44" font-weight="800" fill="#111A3D">Tes clients vont</text>
    <text x="90" y="268" font-size="44" font-weight="800" fill="#111A3D">parler à ton business</text>
    <text x="90" y="322" font-size="44" font-weight="800" fill="#111A3D">dans l'IA.</text>
    <text x="90" y="372" font-size="22" font-weight="500" fill="#5A6488">OpenAI ouvre les « agents business ».</text>
    <text x="90" y="402" font-size="22" font-weight="500" fill="#5A6488">Un nouveau terrain d'acquisition.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
