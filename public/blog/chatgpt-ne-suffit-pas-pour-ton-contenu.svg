<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="ChatGPT ne suffit pas pour ton contenu : une masse de posts identiques et fades face à un contenu distinctif qui se démarque — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="965" cy="330" r="380" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.14">
    <circle cx="965" cy="330" r="160"/>
    <circle cx="965" cy="330" r="230"/>
    <circle cx="965" cy="330" r="300"/>
  </g>

  <!-- tag flagship -->
  <g>
    <rect x="90" y="70" width="200" height="34" rx="17" fill="url(#gacc)"/>
    <text x="190" y="93" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">PIÈCE MAÎTRESSE</text>
  </g>

  <!-- masse de posts identiques et fades -->
  <g>
    <g opacity="0.9">
      <rect x="690" y="210" width="86" height="60" rx="8" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
      <rect x="786" y="210" width="86" height="60" rx="8" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
      <rect x="690" y="280" width="86" height="60" rx="8" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
      <rect x="786" y="280" width="86" height="60" rx="8" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
      <rect x="690" y="350" width="86" height="60" rx="8" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
      <rect x="786" y="350" width="86" height="60" rx="8" fill="#FFFFFF" stroke="#C3C9DC" stroke-width="2"/>
    </g>
    <g fill="#CBD1DF">
      <rect x="702" y="224" width="62" height="7" rx="3.5"/><rect x="702" y="238" width="50" height="7" rx="3.5"/><rect x="702" y="252" width="58" height="7" rx="3.5"/>
      <rect x="798" y="224" width="62" height="7" rx="3.5"/><rect x="798" y="238" width="50" height="7" rx="3.5"/><rect x="798" y="252" width="58" height="7" rx="3.5"/>
      <rect x="702" y="294" width="62" height="7" rx="3.5"/><rect x="702" y="308" width="50" height="7" rx="3.5"/><rect x="702" y="322" width="58" height="7" rx="3.5"/>
      <rect x="798" y="294" width="62" height="7" rx="3.5"/><rect x="798" y="308" width="50" height="7" rx="3.5"/><rect x="798" y="322" width="58" height="7" rx="3.5"/>
      <rect x="702" y="364" width="62" height="7" rx="3.5"/><rect x="702" y="378" width="50" height="7" rx="3.5"/><rect x="702" y="392" width="58" height="7" rx="3.5"/>
      <rect x="798" y="364" width="62" height="7" rx="3.5"/><rect x="798" y="378" width="50" height="7" rx="3.5"/><rect x="798" y="392" width="58" height="7" rx="3.5"/>
    </g>
    <text x="781" y="440" font-size="14" font-weight="600" fill="#8A93AC" text-anchor="middle" font-family="system-ui, sans-serif">Contenu IA générique — tous pareils</text>
  </g>

  <!-- le contenu distinctif qui se demarque -->
  <g>
    <rect x="905" y="272" width="150" height="116" rx="14" fill="url(#gacc)"/>
    <g fill="#FFFFFF">
      <rect x="924" y="294" width="112" height="9" rx="4.5"/>
      <rect x="924" y="312" width="90" height="9" rx="4.5"/>
      <rect x="924" y="330" width="112" height="9" rx="4.5"/>
    </g>
    <path d="M924 358 l7 7 l16 -17" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- etincelle humaine -->
    <path d="M1068 250 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6 z" fill="#2946C8"/>
    <text x="980" y="418" font-size="14" font-weight="700" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">Humain + IA = +47 % d'engagement</text>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="185" font-size="30" font-weight="600" fill="#2946C8">Tout le monde te ment</text>
    <text x="90" y="252" font-size="50" font-weight="800" fill="#111A3D">« ChatGPT suffit</text>
    <text x="90" y="310" font-size="50" font-weight="800" fill="#111A3D">pour ton contenu » ?</text>
    <text x="90" y="362" font-size="22" font-weight="500" fill="#5A6488">Non. Pourquoi le contenu IA brut</text>
    <text x="90" y="392" font-size="22" font-weight="500" fill="#5A6488">ne convertit plus. La preuve.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
