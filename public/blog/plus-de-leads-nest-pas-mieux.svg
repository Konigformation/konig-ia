<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Plus de leads n'est pas mieux : une masse de leads barrés face à quelques leads qualifiés en or — illustration Konig IA.">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#EAEDF5"/>
    </linearGradient>
    <linearGradient id="gacc" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2946C8"/>
      <stop offset="1" stop-color="#1B31A0"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2946C8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2946C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gbg)"/>
  <circle cx="945" cy="315" r="380" fill="url(#gglow)"/>

  <g stroke="#2946C8" fill="none" opacity="0.14">
    <circle cx="945" cy="315" r="160"/>
    <circle cx="945" cy="315" r="230"/>
    <circle cx="945" cy="315" r="300"/>
  </g>

  <!-- tag contre-tendance -->
  <g>
    <rect x="90" y="70" width="196" height="34" rx="17" fill="url(#gacc)"/>
    <text x="188" y="93" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">CONTRE-TENDANCE</text>
  </g>

  <!-- masse de leads gris barres -->
  <g>
    <g fill="#C3C9DC">
      <circle cx="720" cy="215" r="15"/><circle cx="762" cy="215" r="15"/><circle cx="804" cy="215" r="15"/><circle cx="846" cy="215" r="15"/>
      <circle cx="720" cy="257" r="15"/><circle cx="762" cy="257" r="15"/><circle cx="804" cy="257" r="15"/><circle cx="846" cy="257" r="15"/>
      <circle cx="720" cy="299" r="15"/><circle cx="762" cy="299" r="15"/><circle cx="804" cy="299" r="15"/><circle cx="846" cy="299" r="15"/>
      <circle cx="720" cy="341" r="15"/><circle cx="762" cy="341" r="15"/><circle cx="804" cy="341" r="15"/><circle cx="846" cy="341" r="15"/>
    </g>
    <path d="M700 200 l166 156 M866 200 l-166 156" stroke="#8A93AC" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <text x="783" y="392" font-size="15" font-weight="600" fill="#8A93AC" text-anchor="middle" font-family="system-ui, sans-serif">85 % ne convertissent pas</text>
  </g>

  <!-- fleche -->
  <path d="M884 278 h44" stroke="#2946C8" stroke-width="4" stroke-linecap="round"/>
  <path d="M928 278 l-16 -10 M928 278 l-16 10" stroke="#2946C8" stroke-width="4" stroke-linecap="round"/>

  <!-- peu de leads qualifies (or/accent) -->
  <g>
    <circle cx="985" cy="248" r="22" fill="url(#gacc)"/>
    <path d="M974 248 l7 7 l14 -15" stroke="#FFFFFF" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1035" cy="290" r="22" fill="url(#gacc)"/>
    <path d="M1024 290 l7 7 l14 -15" stroke="#FFFFFF" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="985" cy="332" r="22" fill="url(#gacc)"/>
    <path d="M974 332 l7 7 l14 -15" stroke="#FFFFFF" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1010" y="392" font-size="15" font-weight="700" fill="#2946C8" text-anchor="middle" font-family="system-ui, sans-serif">closent 3-5× plus</text>
  </g>

  <!-- titre -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="185" font-size="30" font-weight="600" fill="#2946C8">Tout le monde te ment</text>
    <text x="90" y="252" font-size="52" font-weight="800" fill="#111A3D">« Plus de leads</text>
    <text x="90" y="310" font-size="52" font-weight="800" fill="#111A3D">= mieux » ? Non.</text>
    <text x="90" y="362" font-size="22" font-weight="500" fill="#5A6488">Courir après le volume ruine ton</text>
    <text x="90" y="392" font-size="22" font-weight="500" fill="#5A6488">temps et ton pipeline. La preuve.</text>
  </g>

  <text x="90" y="580" font-size="19" font-weight="700" fill="#1B2559"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Konig IA</text>
</svg>
